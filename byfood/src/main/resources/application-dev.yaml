spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/byfood}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:byfood-dev-secret-key-change-in-production-123456}
    expiration: ${JWT_EXPIRATION:86400000}
