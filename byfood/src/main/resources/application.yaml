spring:
  application:
    name: byfood

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:byfood-dev-secret-key-change-in-production-123456}
    expiration: ${JWT_EXPIRATION:86400000}
